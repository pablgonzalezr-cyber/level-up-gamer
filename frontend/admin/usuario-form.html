<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Administrar usuario</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/formularios.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<header class="admin-header">
    <h1>LEVEL-UP GAMER ADMIN</h1>
    <a href="usuarios.html">Volver a usuarios</a>
</header>

<main class="contenido-formulario">
    <section class="tarjeta-formulario">
        <h2>Usuario</h2>
        <form>
            <label for="run">RUN</label>
            <input type="text" id="run" placeholder="19011022K">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre">

            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos">

            <label for="correo">Correo</label>
            <input type="email" id="correo">

            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento">

            <label for="tipoUsuario">Tipo de usuario</label>
            <select id="tipoUsuario">
                <option value="">Seleccione</option>
                <option value="Administrador">Administrador</option>
                <option value="Cliente">Cliente</option>
                <option value="Vendedor">Vendedor</option>
            </select>

            <label for="region">Región</label>
            <select id="region" onchange="cargarComunas()"></select>

            <label for="comuna">Comuna</label>
            <select id="comuna">
                <option value="">Seleccione una comuna</option>
            </select>

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion">

            <button type="button" onclick="guardarUsuarioAdmin()">Guardar usuario</button>
        </form>
        <div id="mensajes-usuario-admin"></div>
    </section>
</main>

<script src="../js/validaciones.js"></script>
<script src="../js/regiones-comunas.js"></script>
<script src="../js/admin-usuario-form.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Registro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/formularios.css">
</head>
<body>
<header class="header-principal">
    <div class="logo">
        <h1>LEVEL-UP GAMER</h1>
        <p>Tu tienda gamer en Chile</p>
    </div>
    <nav class="nav-principal">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="login.html">Iniciar sesión</a></li>
            <li><a href="registro.html">Registrarse</a></li>
            <li><a class="enlace-carrito" href="carrito.html">Carrito (<span id="contador-carrito">0</span>)</a></li>
        </ul>
    </nav>
</header>

<main class="contenido-formulario">
    <section class="tarjeta-formulario">
        <h2>Crear cuenta</h2>
        <p>Regístrate para formar parte de Level-Up Gamer.</p>

        <form id="form-registro">
            <label for="run">RUN</label>
            <input type="text" id="run" placeholder="19011022K" autocomplete="off">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" autocomplete="given-name">

            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" autocomplete="family-name">

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" autocomplete="email">

            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento">

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" autocomplete="street-address">

            <label for="clave">Contraseña</label>
            <input type="password" id="clave" autocomplete="new-password">

            <label for="confirmarClave">Confirmar contraseña</label>
            <input type="password" id="confirmarClave" autocomplete="new-password">

            <button type="button" onclick="registrarUsuario()">Registrarse</button>
        </form>

        <div id="mensajes-registro"></div>
    </section>
</main>

<footer>
    <p>Level-Up Gamer | Desarrollo Full Stack II - DSY1104</p>
</footer>

<script src="js/comun.js"></script>
<script src="js/validaciones.js"></script>
<script src="js/registro.js"></script>
</body>
</html>
